services:
  api:
    build: .
    container_name: finance-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/finance_api
    depends_on:
      - db
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node server.js"

  db:
    image: postgres:16-alpine
    container_name: finance-api-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: